#gruvbox light
# class                 border  backgr. text    indicator child_border
client.focused          #d65d0e #fbf1c7 #282828 #b57614   #d65d0e
client.focused_inactive #928374 #ebdbb2 #3c3836 #b57614   #928374
client.unfocused        #bdae93 #ebdbb2 #665c54 #ebdbb2   #bdae93
client.urgent           #9d0006 #fbf1c7 #282828 #9d0006   #9d0006
client.placeholder      #fbf1c7 #fbf1c7 #928374 #fbf1c7   #fbf1c7

client.background       #fbf1c7

# i3bar palette (used by bar.conf; bar.conf has dark fallbacks for themes
# that do not define these).
set $i3bar_separator     #d5c4a1
set $i3bar_background    #fbf1c7
set $i3bar_statusline    #3c3836
set $i3bar_focus_border  #d65d0e
set $i3bar_focus_bg      #d65d0e
set $i3bar_focus_fg      #fbf1c7
set $i3bar_active_border #d65d0e
set $i3bar_active_bg     #fbf1c7
set $i3bar_active_fg     #af3a03
set $i3bar_inactive_border #d65d0e
set $i3bar_inactive_bg   #fbf1c7
set $i3bar_inactive_fg   #7c6f64
set $i3bar_urgent_border #9d0006
set $i3bar_urgent_bg     #9d0006
set $i3bar_urgent_fg     #fbf1c7
set $i3bar_binding_border #d65d0e
set $i3bar_binding_bg    #d65d0e
set $i3bar_binding_fg    #fbf1c7
