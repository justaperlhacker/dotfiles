# ~/.config/i3/monitors/monitors.conf
# Map output names to workspace suffixes per host.
# Used by i3-multimonitor.pl for per-monitor workspaces.
#
# For the [default] section, unmapped connected outputs are auto-assigned
# suffixes (a, b, c...) based on xrandr order, so no manual entry is needed
# for unknown machines.

[blackslate]
eDP-1 = a
HDMI-A-1 = b

[destro]
HDMI-A-1 = a
DisplayPort-3 = b

[default]
# Auto-discovered on machines without a host-specific section
