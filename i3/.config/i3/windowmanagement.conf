
###############################################################################
# Moving around in i3
###############################################################################

# Define the movement keys - variables

set $left h
set $down j
set $up k
set $right l

# Use Mouse+$mod to drag floating windows to their wanted position
floating_modifier $mod

# move tiling windows via drag & drop by left-clicking into the title bar,
# or left-clicking anywhere into the window while holding the floating modifier.
tiling_drag modifier titlebar

focus_follows_mouse yes

# change focus
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

# alternatively, you can use the cursor keys:
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# move focused window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# alternatively, you can use the cursor keys:
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# focus other output (cross-monitor)
bindsym $mod+Ctrl+h focus output left
bindsym $mod+Ctrl+j focus output down
bindsym $mod+Ctrl+k focus output up
bindsym $mod+Ctrl+l focus output right
bindsym $mod+Ctrl+Left focus output left
bindsym $mod+Ctrl+Down focus output down
bindsym $mod+Ctrl+Up focus output up
bindsym $mod+Ctrl+Right focus output right

# move focused window to other output (cross-monitor)
bindsym $mod+Ctrl+Shift+h move container to output left
bindsym $mod+Ctrl+Shift+j move container to output down
bindsym $mod+Ctrl+Shift+k move container to output up
bindsym $mod+Ctrl+Shift+l move container to output right
bindsym $mod+Ctrl+Shift+Left move container to output left
bindsym $mod+Ctrl+Shift+Down move container to output down
bindsym $mod+Ctrl+Shift+Up move container to output up
bindsym $mod+Ctrl+Shift+Right move container to output right


###############################################################################
# Tiling parameters
###############################################################################

# default split orientation
default_orientation horizontal

# split in horizontal orientation
#bindsym $mod+h split h;exec notify-send 'tile horizontally'
#bindsym $mod+h split h
bindsym $mod+bar split horizontal

# split in vertical orientation
#bindsym $mod+v split v;exec notify-send 'tile vertically'
#bindsym $mod+v split v
bindsym $mod+underscore split vertical

# toggle split orientation
bindsym $mod+s exec --no-startup-id ~/.config/i3/scripts/toggle-split-orientation
bindsym $mod+Shift+= exec --no-startup-id ~/.config/i3/scripts/toggle-split-orientation

# enter fullscreen mode for the focused container
bindsym $mod+f fullscreen toggle

# enter global fullscreen mode for the focused container
bindsym $mod+Shift+f fullscreen toggle global

# change container layout (stacked, tabbed, toggle split)
#bindsym $mod+e layout toggle

# toggle tiling / floating
#bindsym $mod+t focus mode_toggle

# change focus between tiling / floating windows
bindsym $mod+t floating toggle

# global layout toggle
#bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"
#bindsym $mod+Shift+e exec --no-startup-id ~/.config/i3/scripts/toggle-layout

# Toggle between stacking/tabbed/split:
#bindsym $mod+x layout toggle

# Toggle between stacking/tabbed/splith/splitv:
#bindsym $mod+x layout toggle all

# Toggle between stacking/tabbed/splith:
#bindsym $mod+x layout toggle stacking tabbed splith

# Alternative Toggle between tabbed/split:
bindsym $mod+x layout toggle tabbed splith

# Globally Toggle between tabbed/split for all workspaces
bindsym $mod+shift+x exec ~/.config/i3/scripts/toggle-layout-notify

# rofi launcher
bindsym $alt+space exec --no-startup-id rofi -modi drun -show drun \
		-config ~/.config/i3/rofi/rofidmenu.rasi

# toggle sticky
bindsym $mod+Shift+s sticky toggle

# focus the parent container
#bindsym $mod+a focus parent
# toggle focus from parent <-> child
bindsym $mod+a exec --no-startup-id ~/.config/i3/scripts/toggle-focus-parent-child

# focus the child container
#bindsym $mod+d focus child

###############################################################################
# scratchpad                                                                  #
###############################################################################

# move the currently focused window to the scratchpad
bindsym $mod+Shift+BackSpace move scratchpad;exec notify-send 'moved window to scratchpad'

# Show the next scratchpad window or hide the focused scratchpad window.
# If there are multiple scratchpad windows, this command cycles through them.
bindsym $mod+BackSpace scratchpad show


###############################################################################
# Stopping applications
###############################################################################

# kill app
bindsym $mod+Ctrl+q --release exec --no-startup-id xkill

# kill focused window (graceful close)
bindsym $mod+q kill

##############################################################################
# resize window (you can also use the mouse for that)
##############################################################################

mode "resize" {
        # These bindings trigger as soon as you enter the resize mode

        # Pressing left will shrink the window’s width.
        # Pressing right will grow the window’s width.
        # Pressing up will shrink the window’s height.
        # Pressing down will grow the window’s height.
        bindsym h resize shrink width 5 px or 5 ppt
        bindsym j resize grow height 5 px or 5 ppt
        bindsym k resize shrink height 5 px or 5 ppt
        bindsym l resize grow width 5 px or 5 ppt

        # same bindings, but for the arrow keys
        bindsym Left resize shrink width 5 px or 5 ppt
        bindsym Down resize grow height 5 px or 5 ppt
        bindsym Up resize shrink height 5 px or 5 ppt
        bindsym Right resize grow width 5 px or 5 ppt

        # back to normal: Enter or Escape or $mod+r
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"
}

bindsym $mod+r mode "resize"
