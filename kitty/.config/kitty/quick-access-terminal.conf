# Kitty "quick access" dropdown terminal.
#
# Toggled by ~/.config/niri/scripts/kitty-dropdown (SUPER+F12). The height is
# passed at runtime as `-o lines=<N>px`, computed as 85% of the focused
# output's height, so it is deliberately not set here.

# Drop down from the top edge, full output width (margins left/right are 0).
edge top
margin_left 0
margin_right 0

# Solid by default: at 0.9x this theme lets a surprising amount of the window
# behind bleed through, which is distracting in a full-width dropdown.
# Lower it towards ~0.85 if you want that.
background_opacity 1.0

# Take keyboard focus immediately so you can type the moment it appears.
# Set to `on-demand` if you would rather click into it first.
focus_policy exclusive

# Keep it up when you click elsewhere; toggle it with SUPER+F12 instead.
# Set to `yes` for Guake-style auto-hide (this forces focus_policy=on-demand).
hide_on_focus_loss no

# Wayland namespace, so niri `layer-rule` blocks can target it if ever needed.
app_id kitty-dropdown

# A little breathing room around the text.
kitty_override window_padding_width=8
