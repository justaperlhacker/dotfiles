# Catppuccin Mocha for dunst
# Matches i3 catppuccin.conf theme colors
# Palette: bg=#1e1e2e, fg=#cdd6f4, mauve=#cba6f7, red=#f38ba8

[global]
    frame_color = "#cba6f7"

[urgency_low]
    background = "#313244"
    foreground = "#585b70"
    timeout = 5
    icon = /usr/share/icons/Qogir/16/status/package-installed-outdated.svg

[urgency_normal]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    timeout = 5
    override_pause_level = 30
    icon = /usr/share/icons/Qogir/16/emblems/emblem-question.svg

[urgency_critical]
    background = "#1e1e2e"
    foreground = "#f38ba8"
    frame_color = "#f38ba8"
    timeout = 0
    icon = /usr/share/icons/Qogir/16/actions/dialog-warning.svg
