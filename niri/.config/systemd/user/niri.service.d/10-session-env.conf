[Service]
# niri-session runs `systemctl --user import-environment`, which resets
# XDG_CURRENT_DESKTOP to "niri" from the login session. Restore the full
# identity before niri signals readiness, so dms.service
# (After=graphical-session.target) and XDG autostart units inherit it.
ExecStartPre=/usr/bin/systemctl --user set-environment XDG_CURRENT_DESKTOP=niri:KDE:gnome
