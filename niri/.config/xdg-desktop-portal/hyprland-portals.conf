[preferred]
# Hyprland session (XDG_CURRENT_DESKTOP=Hyprland:KDE:gnome).
# Hyprland implements its own ScreenCast/Screenshot/GlobalShortcuts portal.
# The existing gnome-portals.conf (loaded last) supplies:
#   Settings=gtk, Secret=kwallet, Notification=plasmanotify.
default=kde
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
