# Intel HD 620 (Kaby Lake) on blackslate. Native Wayland (avoid XWayland).
# VA-API decode (H264/VP8/VP9/HEVC; no AV1 HW on KBL) via stable GL ANGLE
# path + zero-copy. Tested 2026-10-31: Vulkan ANGLE segfaulted the GPU
# process (exit 139) in headless trials while this GL config was clean.
# (~/.local/bin/brave layers default.conf first.)
--ozone-platform-hint=auto
--use-gl=angle
--use-angle=gl
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
