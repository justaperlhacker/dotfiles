# One Dark for dunst
# Matches i3 onedark.conf theme colors
# Palette: bg=#282c34, fg=#abb2bf, blue=#61afef, red=#e06c75

[global]
    frame_color = "#61afef"

[urgency_low]
    background = "#2c313a"
    foreground = "#5c6370"
    timeout = 5
    icon = /usr/share/icons/Qogir/16/status/package-installed-outdated.svg

[urgency_normal]
    background = "#282c34"
    foreground = "#abb2bf"
    timeout = 5
    override_pause_level = 30
    icon = /usr/share/icons/Qogir/16/emblems/emblem-question.svg

[urgency_critical]
    background = "#282c34"
    foreground = "#e06c75"
    frame_color = "#e06c75"
    timeout = 0
    icon = /usr/share/icons/Qogir/16/actions/dialog-warning.svg
