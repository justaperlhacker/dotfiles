# vim: syntax=tmux

#~/.config/tmux/              # config
#~/.local/share/tmux/         # plugins + TPM
#$XDG_RUNTIME_DIR/tmux/       # sockets + sessions

# Move socket out of /tmp
set-environment -g TMUX_TMPDIR "$XDG_RUNTIME_DIR/tmux"

# Use XDG config paths
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

# changes the default Ctrl-b to Ctrl-z
unbind C-b
set -g prefix C-z
bind z send-prefix

# bind prefix + z to zoom
bind z resize-pane -Z

# help tmux understand kitty's keyboard protocol
set -g extended-keys on
set -g xterm-keys    on

# force the kitty keyboard protocol for xterm-kitty
set -ga terminal-features 'xterm-kitty:kitty'

set -g base-index 1
set -g pane-base-index 1
set -s escape-time 0

# windows and panes
bind | split-window -h
bind - split-window -v
bind q kill-pane
bind x kill-window

bind-key -r M-Up    resize-pane -U
bind-key -r M-Down  resize-pane -D
bind-key -r M-Left  resize-pane -L
bind-key -r M-Right resize-pane -R

set -g renumber-windows on
set -g aggressive-resize on

set -g status on
set -g status-interval 2


#set -g display-time 3000
set -g history-limit 100000

# No bells at all
set -g bell-action none
#set -g visual-activity off
#set -g visual-bell on

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

set -g set-titles on
set-window-option -g automatic-rename on
set-window-option -g alternate-screen on
set-window-option -g clock-mode-style 24

#set -g default-terminal "screen-256color"
#set -g default-terminal "xterm-256color"
set -g default-terminal "tmux-256color"
#set-option -g default-shell /bin/bash
#set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Turn the mouse on, but without copy mode dragging
set -g mouse on
unbind -n MouseDrag1Pane
unbind -Tcopy-mode MouseDrag1Pane

# Move window right
bind -n C-S-Right swap-window -t +1 \; select-window -t +1
bind -n C-S-l     swap-window -t +1 \; select-window -t +1
# Move window left
bind -n C-S-Left  swap-window -t -1 \; select-window -t -1
bind -n C-S-h     swap-window -t -1 \; select-window -t -1

# Ctrl+Tab / Ctrl+Shift+Tab for next/prev window
bind -n C-Tab   select-window -n
bind -n C-S-Tab select-window -p

# ALT n/p next and previous window
bind -n M-n select-window -n
bind -n M-p select-window -p

# ALT ]/[ next and previous window
bind -n M-[ select-window -p
bind -n M-] select-window -n

# ALT 0-9 select window
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alternively CTRL+Shift+0-9
# bind -n C-S-0 select-window -t 0
# bind -n C-S-1 select-window -t 1
# bind -n C-S-2 select-window -t 2
# bind -n C-S-3 select-window -t 3
# bind -n C-S-4 select-window -t 4
# bind -n C-S-5 select-window -t 5
# bind -n C-S-6 select-window -t 6
# bind -n C-S-7 select-window -t 7
# bind -n C-S-8 select-window -t 8
# bind -n C-S-9 select-window -t 9

# Keys to toggle monitoring activity in a window, and synchronize-panes
#bind m set monitor-activity
#bind y set synchronize-panes\; display 'synchronize-panes #{?synchronize-panes,on,off}'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# vi for copy mode
setw -g mode-keys vi

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# bind additional arrow keys
bind-key -n 'C-Left'  if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-Down'  if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-Up'    if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-Right' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-Left' select-pane -L
bind-key -T copy-mode-vi 'C-Down' select-pane -D
bind-key -T copy-mode-vi 'C-Up' select-pane -U
bind-key -T copy-mode-vi 'C-Right' select-pane -R

#set -g status-left "[#S] | "
set -g status-left "#S | "
set -g status-right "| %Y-%m-%d %H:%M"
#set -g status-right "[%Y-%m-%d %H:%M]"

#set -g status-position top
set -g status-position bottom
set -g status-left-length 100

# default colors
set -g status-style bg=default,fg=default
set -g message-style fg=default,bg=default

#set -g status-bg black
#set -g status-fg white

#set -g status-bg default
#set -g status-fg default

#set -g status-bg black
#set -g status-fg white

# default inactive/active window styles
#set -g window-style fg=default,bg=default
#set -g window-active-style fg=default,bg=default

#set -g pane-border-style fg=gray
#set -g pane-active-border-style fg=gray,bold
#set -g pane-active-border-style fg=yellow,bold
#set -g pane-active-border-style fg=colour166,bold
#set -g pane-border-style fg=colour166

# format for inactive windows
set -g window-status-format " #I:#W "

# format for active window
#set -g window-status-current-format "#{?window_zoomed_flag,[#I:#W Z],[#I:#W]}"
set -g window-status-current-format "#{?window_zoomed_flag,[#[underscore]#I:#W Z],[#[underscore]#I:#W]}"
#set -g window-status-current-format "[#[underscore]#I:#W]"

#source ~/.config/tmux/tmux.conf.colors
