# vim:ft=kitty
## name: Nord Light Lost
## author: Gogh project (upstream author not listed)
## license: MIT
## upstream: https://github.com/Gogh-Co/Gogh/blob/master/themes/Nord%20Light%20Lost.yml
## blurb: Nord Light Lost from Gogh, with kitty UI colours derived from the same palette.
#
# ANSI colours, background, foreground and cursor are copied directly from the
# Gogh "Nord Light Lost" theme. Selection, URL, border and tab colours are
# derived from the same 16-colour palette so the theme fits this kitty setup
# without introducing new colours.
#
# Note: ANSI 7 and 15 are light by upstream design and are not meant to be used
# as body text on this light background.

background                #ebeaf2
foreground                #004f7c

selection_background      #b3b3b3
selection_foreground      #003b4e

cursor                    #439ecf
cursor_text_color         #003b4e

url_color                 #3e89a1

active_border_color       #439ecf
inactive_border_color     #dedede
bell_border_color         #e64569
visual_bell_color         none

active_tab_foreground     #003b4e
active_tab_background     #96dcda
inactive_tab_foreground   #3e89a1
inactive_tab_background   #ebeaf2
tab_bar_background        #ebeaf2
tab_bar_margin_color      none

# Normal ANSI colours
color0                    #003b4e
color1                    #e64569
color2                    #069f5f
color3                    #dab752
color4                    #439ecf
color5                    #d961dc
color6                    #00b1be
color7                    #b3b3b3

# Bright ANSI colours
color8                    #3e89a1
color9                    #e4859a
color10                   #a2cca1
color11                   #e1e387
color12                   #6fbbe2
color13                   #e586e7
color14                   #96dcda
color15                   #dedede
