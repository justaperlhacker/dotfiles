# Nord for dunst
# Matches i3 nord.conf theme colors
# Palette: bg=#2e3440, fg=#d8dee9, blue=#81a1c1, red=#bf616a

[global]
    frame_color = "#81a1c1"

[urgency_low]
    background = "#3b4252"
    foreground = "#4c566a"
    timeout = 5
    icon = /usr/share/icons/Qogir/16/status/package-installed-outdated.svg

[urgency_normal]
    background = "#2e3440"
    foreground = "#d8dee9"
    timeout = 5
    override_pause_level = 30
    icon = /usr/share/icons/Qogir/16/emblems/emblem-question.svg

[urgency_critical]
    background = "#2e3440"
    foreground = "#bf616a"
    frame_color = "#bf616a"
    timeout = 0
    icon = /usr/share/icons/Qogir/16/actions/dialog-warning.svg
