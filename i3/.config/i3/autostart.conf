# autostart
# start some programes when i3 starts

# set monitor layout based on hostname
exec --no-startup-id ~/.config/i3/monitors/select-monitor.sh

# make sure it loads gtk configs
exec_always $HOME/.config/i3/scripts/import-gsettings

# picom and wallpaper
#exec_always --no-startup-id picom --config ~/.config/i3/picom.conf



# polybar
#exec_always --no-startup-id ~/.config/i3/scripts/polybar.sh &

# Configure keyboard repeat rate
# xset r rate <delay>       <repeatrate>
#             lower=shorter lower=slower
#     default 500           30
#exec --no-startup-id xset r rate 250 90
exec --no-startup-id xset r rate 300 50

# turn off bell
exec --no-startup-id xset b off

# disable capslock
# exec --no-startup-id setxkbmap -option ctrl:nocaps

# set capslock as an additional ctrl
#exec --no-startup-id setxkbmap -option caps:ctrl_modifier

# set capslock as win key
#exec --no-startup-id setxkbmap -option caps:super

# set capslock as escape key
#exec --no-startup-id setxkbmap -option caps:escape


# merge xrdb
exec --no-startup-id xrdb -merge ~/.Xresources

# start gnome settings deamon
#exec --no-startup-id /usr/libexec/gsd-xsettings

# start gnome keyring deamon
#exec --no-startup-id /usr/bin/gnome-keyring-daemon --start --components=secrets &

# start gnome power manager
#exec_always --no-startup-id gnome-power-manager

# Authentication dialog (polkit-1-gnome)
# Starts authentication-agent needed to get sudo password check available for GUIs needing it.
#exec --no-startup-id /usr/lib/policykit-gnome/polkit-gnome-authentication-agent-1 &

# KDE / KWallet integration
exec --no-startup-id dbus-update-activation-environment --systemd XDG_CURRENT_DESKTOP=KDE KDE_SESSION_VERSION=6 KDE_FULL_SESSION=true

# run kwallet services
# NOTE: Do NOT start the PAM kwallet helper from X autostart — it should be invoked by PAM at login
# exec --no-startup-id /usr/lib/pam_kwallet_init &
# Start the kwallet daemon (the session usually starts this automatically)
exec --no-startup-id /usr/bin/kwalletd6 &
# Optional: start KDE Wallet Manager to get a GUI unlock prompt at login (install `kwalletmanager5` to use)
# Start hidden in the i3 scratchpad so it doesn't steal the screen at login; reveal with `i3-msg scratchpad show`
exec --no-startup-id sh -c 'kwalletmanager5 & sleep 0.7; i3-msg "[title=\"(?i)kde wallet\"] move to scratchpad"' &

# run the kde polkit agent
exec --no-startup-id /usr/lib/polkit-kde-authentication-agent-1 &

# Desktop notifications

# notifications
exec --no-startup-id dunst -config ~/.config/i3/dunst/dunstrc &

# dunst config used ~/.config/dunst/dunstrc
# set alternative config if needed:
#exec --no-startup-id /usr/bin/dunst --config ~/.config/dunst/dunstrc
# may need to run dbus-launch explicitly:
#exec --no-startup-id dbus-launch /usr/bin/dunst
#exec --no-startup-id /usr/bin/dunst

# alternative if you installed aside with XFCE4:
# exec --no-startup-id /usr/lib/xfce4/notifyd/xfce4-notifyd &

# autotiling script
# https://github.com/nwg-piotr/autotiling
# `pacman -Syu autotiling`
#exec_always --no-startup-id autotiling

# The combination of xss-lock, nm-applet and pactl is a popular choice, so
# they are included here as an example. Modify as you see fit.

# xss-lock grabs a logind suspend inhibit lock and will use i3lock to lock the
# screen before suspend. Use loginctl lock-session to lock your screen.
#exec --no-startup-id xss-lock --transfer-sleep-lock -- i3lock -i ~/Pictures/Wallpapers/i3lockdualwallpaper.png --color=000000 --nofork
exec --no-startup-id xss-lock --transfer-sleep-lock -- ~/.config/i3/scripts/lock.sh

# xautolock && suspend
#exec --no-startup-id xautolock -time 10 -locker "/home/$USER/.config/i3/scripts/lock.sh"
#exec --no-startup-id xautolock -time 10 -locker blurlock

# use xautolock to use autosuspend rules for mobile devices
# https://wiki.archlinux.org/title/Session_lock#xautolock
#exec --no-startup-id xautolock -time 60 -locker "systemctl suspend"

# xscreensaver
# https://www.jwz.org/xscreensaver
#exec --no-startup-id xscreensaver --no-splash

# set powersavings for display:
exec --no-startup-id xset s 480 dpms 600 600 600

# disable power saving (for example if using xscreensaver)
#exec --no-startup-id xset -dpms

## system tray

# if you do not use dex: exec --no-startup-id dex --autostart --environment i3
# you need to have tray apps started manually one by one:

# NetworkManager is the most popular way to manage wireless networks on Linux,
# and nm-applet is a desktop environment-independent system tray GUI for it.
exec --no-startup-id nm-applet

# cachy-update systray applet
exec --no-startup-id env TERMINAL=kitty cachy-update --tray

# i3-MultiMonitor: per-monitor workspaces (niri-style)
exec_always --no-startup-id ~/.config/i3/scripts/i3-multimonitor.pl

# set wallpaper
exec --no-startup-id ~/.config/i3/scripts/fehbg
#exec --no-startup-id sleep 2 && nitrogen --restore
#exec_always --no-startup-id nitrogen --restore
#exec --no-startup-id sleep 1 && feh --bg-fill /usr/share/endeavouros/backgrounds/endeavouros-wallpaper.png

# A service that provides the org.kde.StatusNotifierWatcher interface for XApps
exec --no-startup-id snixembed &

# start blueberry app for managing bluetooth devices from tray:
# NOTE: blueberry-tray is not currently installed — uncomment after installing
#exec --no-startup-id blueberry-tray

# Bluetooth systray applet
exec --no-startup-id blueman-applet

# dropdown terminal
#exec --no-startup-id guake

# dropdown terminal
exec --no-startup-id yakuake

# discord
exec --no-startup-id discord --start-minimized

# whatsie (flatpak)
exec --no-startup-id flatpak run com.ktechpit.whatsie
# whatsie
#exec --no-startup-id whatsie

# clipman-applet
#exec --no-startup-id xfce4-clipman

# GTK+ clipboard manager
#exec --no-startup-id diodon

# automount usb drives
exec --no-startup-id /usr/bin/udiskie -a -n -t &

# start the xfce power manager
#exec --no-startup-id xfce4-power-manager &

#exec_always --no-startup-id ff-theme-util
#exec_always --no-startup-id fix_xcursor

# start onedrive-gui
exec --no-startup-id $HOME/.local/bin/OneDriveGUI-1.3.2-x86_64.AppImage &
# start redshift-gtk
exec --no-startup-id killall -q redshift-gtk; env GTK_ICON_THEME=breeze-dark redshift-gtk &
# run bash script
#exec --no-startup-id ~/.config/i3/scripts/autostart.sh 2>/dev/null &

# Start XDG autostart .desktop files using dex. See also
# https://wiki.archlinux.org/index.php/XDG_Autostart
# commenting this out because this starts stuff twice in i3+GNOME session
#exec --no-startup-id dex -a -s ~/.config/autostart
#exec --no-startup-id dex --autostart --environment i3
#exec --no-startup-id dex --autostart --environment i3 --search-paths ~/.config/i3/autostart 2>dev/null &

# xeyes as a tray icon (self-contained XEmbed client)
exec_always --no-startup-id ~/.config/i3/scripts/trayxeyes
