[Service]
# dms.service is pulled in as part of niri.service's startup transaction. Its
# environment is captured before niri.service's late set-environment call, so
# it misses the XDG_CURRENT_DESKTOP suffix (niri-session imported "niri").
# DMS is only wanted by niri.service here, so pin the full session identity.
Environment=XDG_CURRENT_DESKTOP=niri:KDE:gnome KDE_SESSION_VERSION=6 KDE_FULL_SESSION=true QT_QPA_PLATFORMTHEME=kde QT_STYLE_OVERRIDE=Breeze
