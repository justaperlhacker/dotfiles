# Gruvbox Light for dunst
# Matches i3 gruvbox-light theme colors
# Palette: bg=#fbf1c7, bg1=#ebdbb2, fg=#3c3836, orange=#d65d0e, red=#9d0006

[global]
    frame_color = "#d65d0e"

[urgency_low]
    background = "#ebdbb2"
    foreground = "#7c6f64"
    timeout = 5
    icon = /usr/share/icons/Qogir/16/status/package-installed-outdated.svg

[urgency_normal]
    background = "#fbf1c7"
    foreground = "#3c3836"
    timeout = 5
    override_pause_level = 30
    icon = /usr/share/icons/Qogir/16/emblems/emblem-question.svg

[urgency_critical]
    background = "#fbf1c7"
    foreground = "#9d0006"
    frame_color = "#9d0006"
    timeout = 0
    icon = /usr/share/icons/Qogir/16/actions/dialog-warning.svg
