# Dracula for dunst
# Matches i3 dracula.conf theme colors
# Palette: bg=#282a36, fg=#f8f8f2, purple=#bd93f9, pink=#ff79c6

[global]
    frame_color = "#bd93f9"

[urgency_low]
    background = "#44475a"
    foreground = "#6272a4"
    timeout = 5
    icon = /usr/share/icons/Qogir/16/status/package-installed-outdated.svg

[urgency_normal]
    background = "#282a36"
    foreground = "#f8f8f2"
    timeout = 5
    override_pause_level = 30
    icon = /usr/share/icons/Qogir/16/emblems/emblem-question.svg

[urgency_critical]
    background = "#282a36"
    foreground = "#ff5555"
    frame_color = "#ff5555"
    timeout = 0
    icon = /usr/share/icons/Qogir/16/actions/dialog-warning.svg
