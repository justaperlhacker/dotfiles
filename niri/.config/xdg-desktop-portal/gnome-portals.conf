[preferred]
# Used only when XDG_CURRENT_DESKTOP contains "gnome", i.e. the niri session
# (which sets KDE:gnome). Plasma sets XDG_CURRENT_DESKTOP=KDE, so it ignores
# this file and keeps using /usr/share/xdg-desktop-portal/kde-portals.conf.
#
# Based on the KDE portal config, but route the Settings interface through the
# GTK backend. The KDE backend reports color-scheme from Plasma's scheme
# (BreezeLight) and ignores the org.gnome.desktop.interface color-scheme that
# DMS sets, which made kitty and Brave always see light mode. GTK reads
# gsettings instead.
default=kde
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Notification=plasmanotify
