# KDE/Qt session identity for systemd user units (DMS, XDG autostart, ...).
# niri's config.kdl environment{} carries the same values for processes niri
# spawns directly. XDG_CURRENT_DESKTOP is handled separately: niri-session's
# `systemctl --user import-environment` overwrites it, so niri.service restores
# it in niri.service.d/10-session-env.conf.
KDE_SESSION_VERSION=6
KDE_FULL_SESSION=true
QT_QPA_PLATFORMTHEME=kde
QT_STYLE_OVERRIDE=Breeze
