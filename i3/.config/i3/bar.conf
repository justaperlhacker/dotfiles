
# bar toggle, hide or show
#bindsym $mod+b bar mode toggle
#bindsym $mod+i bar mode invisible

# bar settings (input comes from i3blocks)

bar {
    status_command i3blocks -c ~/.config/i3/i3blocks/config
    workspace_command /usr/bin/env i3-workspace-buttons.pl
    tray_output primary
    mode dock
    position bottom
    font pango:JetBrainsMono Nerd Font 9
    #font pango:JetBrainsMono Nerd Font 10
    #font pango:IosevkaTerm Nerd Font 10
    workspace_buttons yes
    strip_workspace_numbers no
    strip_workspace_name no
    workspace_min_width 30
    tray_padding 1

#    from endeavouros
#    colors {
#        separator #081419
#        background #253941
#        #statusline #839496
#        <colorclass> <border> <background> <text>
#        focused_workspace  #fdf6e3 #6c71c4 #fdf6e3
#        active_workspace   #fdf6e3 #6c71c4 #fdf6e3
#        inactive_workspace #002b36 #586e75 #002b36
#        urgent_workspace   #d33682 #d33682 #fdf6e3

#        statusline         $white
#        separator          $transparent
#  }

    # default colors
    # colors {
    #     background #000000
    #     statusline #ffffff
    #     separator #666666

    #     focused_workspace  #4c7899 #285577 #ffffff
    #     active_workspace   #333333 #5f676a #ffffff
    #     inactive_workspace #333333 #222222 #888888
    #     urgent_workspace   #2f343a #900000 #ffffff
    #     binding_mode       #2f343a #900000 #ffffff
    # }

    # Palette comes from the active theme's i3.conf (fallbacks are defined in
    # appearance.conf before the theme include).
    colors {
        separator          $i3bar_separator
        background         $i3bar_background
        statusline         $i3bar_statusline

#       <colorclass>       <border> <background> <text>
        focused_workspace  $i3bar_focus_border $i3bar_focus_bg $i3bar_focus_fg
        active_workspace   $i3bar_active_border $i3bar_active_bg $i3bar_active_fg
        inactive_workspace $i3bar_inactive_border $i3bar_inactive_bg $i3bar_inactive_fg
        urgent_workspace   $i3bar_urgent_border $i3bar_urgent_bg $i3bar_urgent_fg
        binding_mode       $i3bar_binding_border $i3bar_binding_bg $i3bar_binding_fg

        separator          $transparent
  }


}

