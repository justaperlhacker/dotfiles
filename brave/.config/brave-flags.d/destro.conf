# AMD Radeon RX 6700 XT (navi22, RDNA2) drives the Wayland compositor; the
# RTX 3060 is headless, so Chromium stays on the AMD render node
# (/dev/dri/renderD129) and must not hand VA-API to libva-nvidia-driver.
# VA-API decode (H264/HEVC/VP9/AV1; RDNA2 has no AV1 encode) goes through
# Mesa radeonsi, with GL ANGLE for zero-copy frame import.
#
# Tested 2026-11-01 on destro: ANGLE/Vulkan crashed the GPU process
# (exit_code 8704, "Restarting GPU process due to unrecoverable error") just
# like on blackslate's Intel HD 620, so GL is pinned explicitly instead of
# relying on Chromium's default ANGLE backend.
# Decode verified 2026-11-01: 4K60 VP9/AV1 and 4K30 VP9/AV1/HEVC 10-bit,
# 1080p60/1440p60 H.264, all via VaapiVideoDecoder with zero dropped frames.
#
# Chromium honours only ONE --enable-features / --disable-features value, so
# keep each to a single comma-separated line per file.
# (~/.local/bin/brave layers default.conf first.)
--use-gl=angle
--use-angle=gl
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
--disable-features=VaapiOnNvidiaGPUs
