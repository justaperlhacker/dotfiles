
# Font Configuration

font_family       family="JetBrainsMono Nerd Font"
#font_family      family="Berkeley Mono Nerd Font"
#font_family      family="HE_TERMINAL NL"
#font_family      family="HE_TERMINAL Nerd Font" postscript_name=HE_TERMINALNF-Medium
#bold_font        family="HE_TERMINAL Nerd Font" postscript_name=HE_TERMINALNF-Regular
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         12.0
disable_ligatures always
# enable alternate zero and oddstyle numerals, need to use postscript name
#font_features FiraCode-Retina +zero +onum
# decrease height just a bit HE_TERMINAL, good for 12 and up
#modify_font cell_height -1px
#modify_font cell_height -2px
#text_fg_override_threshold 4.5

include hosts/${HOSTNAME}_font.conf

# Disable system bell
enable_audio_bell no

# Window Configuration
window_padding_width 0
#background_opacity 1.0
background_opacity 0.9
background_blur 0
hide_window_decorations yes
# fix font rendering issues
#text_composition_strategy legacy

# Don't prompt to confirm closing the OS window
confirm_os_window_close 0

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Scrollback
scrollback_lines 99000
scrollbar scrolled

# Shell integration
shell_integration enabled

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1
cursor_shape_unfocused hollow
cursor_beam_thickness 2.0
#shell_integration no-cursor

# Cursor trail
cursor_trail 2
cursor_trail_decay 0.2 0.6
# cursor_trail_color #ff9e64
# single-cell moves (typing) also leave a trail; default 2 skips them
cursor_trail_start_threshold 1


# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+shift+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration - GNOME-like stretch (full-width equal tabs)
# Style is selected in tab_bar.py via TAB_STYLE / KITTY_TAB_STYLE:
# flat | powerline (legacy) | powerline_stretch
tab_bar_edge               top
tab_bar_style              custom
# tab_powerline_style angled, slanted, round (used by powerline variants)
tab_powerline_style        angled
tab_bar_align              center
tab_bar_min_tabs           2
tab_bar_margin_width       0.0
tab_bar_margin_height      0.0 0.0
active_tab_font_style      normal
inactive_tab_font_style    normal
tab_activity_symbol        " ● "
tab_title_template         "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
active_tab_title_template  "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"

# Tab navigation
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+0 goto_tab 10
# Theme Configurations

# Dank color generation
#include dank-tabs.conf
#include dank-theme.conf

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME