# Everforest Dark for dunst
# Matches i3 everforest.conf theme colors
# Palette: bg=#2d353b, fg=#d3c6aa, green=#a7c080, red=#e67e80

[global]
    frame_color = "#a7c080"

[urgency_low]
    background = "#343f3c"
    foreground = "#56635f"
    timeout = 5
    icon = /usr/share/icons/Qogir/16/status/package-installed-outdated.svg

[urgency_normal]
    background = "#2d353b"
    foreground = "#d3c6aa"
    timeout = 5
    override_pause_level = 30
    icon = /usr/share/icons/Qogir/16/emblems/emblem-question.svg

[urgency_critical]
    background = "#2d353b"
    foreground = "#e67e80"
    frame_color = "#e67e80"
    timeout = 0
    icon = /usr/share/icons/Qogir/16/actions/dialog-warning.svg
