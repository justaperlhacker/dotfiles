##############################################################################
# set default workspace layout
##############################################################################

# default i3 tiling mode:
workspace_layout default

# i3 stacking layout:
# Each window will be fullscreen and tabbed top to bottom.
# workspace_layout stacking

# i3 tabbed layout:
# Each new window will open fullscreen as a tab (left to right)
# workspace_layout tabbed

##############################################################################
# moving around workspaces
##############################################################################

# navigate workspaces next / previous
#bindsym $mod+Ctrl+Right workspace next
#bindsym $mod+Ctrl+Left workspace prev
# using this because of Citrix to windows
bindsym $mod+$alt+Right workspace next
bindsym $mod+$alt+Left workspace prev

# cycle workspaces only on the currently focused monitor (niri-style)
bindsym $mod+Ctrl+Right workspace next_on_output
bindsym $mod+Ctrl+Left workspace prev_on_output

# workspace back and forth (with/without active container)
workspace_auto_back_and_forth yes
bindsym $mod+b workspace back_and_forth
bindsym $mod+Shift+b move container to workspace back_and_forth; workspace back_and_forth

# send container to output left

##############################################################################
# Workspace names
##############################################################################

# to display names or symbols instead of plain workspace numbers you can use
# something like: set $ws1 1:mail
#                 set $ws2 2:

# Define names for default workspaces for which we configure key bindings later on.
# We use variables to avoid repeating the names in multiple places.
# Left monitor local workspaces (1a-8a)
set $ws1 1a
set $ws2 2a
set $ws3 3a
set $ws4 4a
set $ws5 5a
set $ws6 6a
set $ws7 7a
set $ws8 8a

# Right monitor local workspaces (1b-8b)
set $wsl1 1b
set $wsl2 2b
set $wsl3 3b
set $wsl4 4b
set $wsl5 5b
set $wsl6 6b
set $wsl7 7b
set $wsl8 8b

# i3-MultiMonitor: number keys are intercepted by the daemon and mapped to the
# focused monitor's own workspace set, so each monitor has independent 1-8.
bindsym $mod+1 nop
bindsym $mod+2 nop
bindsym $mod+3 nop
bindsym $mod+4 nop
bindsym $mod+5 nop
bindsym $mod+6 nop
bindsym $mod+7 nop
bindsym $mod+8 nop

# Move to workspace with focused container
bindsym $mod+Shift+1 nop
bindsym $mod+Shift+2 nop
bindsym $mod+Shift+3 nop
bindsym $mod+Shift+4 nop
bindsym $mod+Shift+5 nop
bindsym $mod+Shift+6 nop
bindsym $mod+Shift+7 nop
bindsym $mod+Shift+8 nop

# Send focused container to workspace (no switch)
bindsym $mod+Ctrl+1 nop
bindsym $mod+Ctrl+2 nop
bindsym $mod+Ctrl+3 nop
bindsym $mod+Ctrl+4 nop
bindsym $mod+Ctrl+5 nop
bindsym $mod+Ctrl+6 nop
bindsym $mod+Ctrl+7 nop
bindsym $mod+Ctrl+8 nop

# Define monitor variables
set $monitor_left  "HDMI-A-1"
set $monitor_right "DisplayPort-3"

# Bind workspaces to monitors (each monitor gets its own 1-8)
workspace $ws1 output $monitor_left
workspace $ws2 output $monitor_left
workspace $ws3 output $monitor_left
workspace $ws4 output $monitor_left
workspace $ws5 output $monitor_left
workspace $ws6 output $monitor_left
workspace $ws7 output $monitor_left
workspace $ws8 output $monitor_left
workspace $wsl1 output $monitor_right
workspace $wsl2 output $monitor_right
workspace $wsl3 output $monitor_right
workspace $wsl4 output $monitor_right
workspace $wsl5 output $monitor_right
workspace $wsl6 output $monitor_right
workspace $wsl7 output $monitor_right
workspace $wsl8 output $monitor_right

