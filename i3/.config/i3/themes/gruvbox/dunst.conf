# Gruvbox Dark for dunst
# Matches i3 gruvbox.conf theme colors
# Palette: bg=#282828, bg1=#3c3836, fg=#ebdbb2, orange=#d65d0e, red=#cc241d

[global]
    frame_color = "#d65d0e"

[urgency_low]
    background = "#3c3836"
    foreground = "#a89984"
    timeout = 5
    icon = /usr/share/icons/Qogir/16/status/package-installed-outdated.svg

[urgency_normal]
    background = "#282828"
    foreground = "#ebdbb2"
    timeout = 5
    override_pause_level = 30
    icon = /usr/share/icons/Qogir/16/emblems/emblem-question.svg

[urgency_critical]
    background = "#282828"
    foreground = "#fb4934"
    frame_color = "#cc241d"
    timeout = 0
    icon = /usr/share/icons/Qogir/16/actions/dialog-warning.svg
