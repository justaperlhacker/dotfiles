# GitHub Dark for dunst
# Palette: bg=#0d1117, bg1=#161b22, fg=#e6edf3, accent=#58a6ff, red=#f85149

[global]
    frame_color = "#58a6ff"

[urgency_low]
    background = "#161b22"
    foreground = "#8b949e"
    timeout = 5
    icon = /usr/share/icons/Qogir/16/status/package-installed-outdated.svg

[urgency_normal]
    background = "#0d1117"
    foreground = "#e6edf3"
    timeout = 5
    override_pause_level = 30
    icon = /usr/share/icons/Qogir/16/emblems/emblem-question.svg

[urgency_critical]
    background = "#0d1117"
    foreground = "#f85149"
    frame_color = "#f85149"
    timeout = 0
    icon = /usr/share/icons/Qogir/16/actions/dialog-warning.svg
