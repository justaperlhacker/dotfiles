
# BEGIN_KITTY_FONTS
font_family      family="BerkeleyMono Nerd Font" style=Medium
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Font Configuration
#font_family family="HE_TERMINAL NL"
#font_family family="JetBrainsMono Nerd Font"
#font_family family="Berkeley Mono Nerd Font"
font_size   13.0
disable_ligatures always
# enable alternate zero and oddstyle numerals, need to use postscript name
#font_features FiraCode-Retina +zero +onum

# decrease height just a bit HE_TERMINAL, good for 12 and up
#modify_font cell_height -1px
#modify_font cell_height -2px
text_fg_override_threshold 4.5
# Window Configuration
window_padding_width 0
#background_opacity 1.0
background_opacity 0.9
background_blur 0
# hide_window_decorations yes
# fix font rendering issues
#text_composition_strategy legacy

# Don't prompt to confirm closing the OS window
confirm_os_window_close 0

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Scrollback
scrollback_lines 99000
scrollbar scrolled

# Shell integration
shell_integration enabled

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1
cursor_shape_unfocused hollow
cursor_beam_thickness 2.0
#shell_integration no-cursor

# Cursor trail
cursor_trail 3
cursor_trail_decay 0.1 0.4


# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+shift+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_edge               top
tab_bar_style              powerline
# tab_powerline_style angled, slanted, round
tab_powerline_style        angled
tab_bar_align              left
tab_bar_min_tabs           2
tab_bar_margin_width       0.0
#tab_bar_margin_height      2.5 1.5
tab_bar_margin_height      0.0 0.0
# tab_bar_margin_color       #101418
active_tab_font_style      bold
inactive_tab_font_style    normal
tab_activity_symbol        " ● "
#tab_numbers_style          1
tab_title_template         "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:40]}{title[40:] and '…'} [{index}]"
active_tab_title_template  "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:40]}{title[40:] and '…'} [{index}]"

# Tab navigation
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+0 goto_tab 10
# Theme Configurations

# titus-dwm theme
#include active-theme.conf

# Dank color generation
#include dank-tabs.conf
#include dank-theme.conf

# BEGIN_KITTY_THEME
# Batman
include current-theme.conf
# END_KITTY_THEME