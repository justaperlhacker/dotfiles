# class                 border  backgr. text    indicator child_border
#client.focused          #d65d0e #d65d0e #1a1826 #ebdbb2   #d65d0e
#client.focused_inactive #928374 #928374 #ebdbb2 #ebdbb2   #928374
client.focused          #d65d0e #292d2e #ebdbb2 #fabd2f   #d65d0e
client.focused_inactive #928374 #292d2e #ebdbb2 #fabd2f   #928374
client.unfocused        #333333 #292d2e #ebdbb2 #292d2e   #333333
client.urgent           #cc241d #900000 #ebdbb2 #cc241d   #cc241d
client.placeholder      #282828 #282828 #d65d0e #ebdbb2   #282828

client.background        #282828

# i3bar palette (used by bar.conf; bar.conf has dark fallbacks for themes
# that do not define these).
set $i3bar_separator     #081419
set $i3bar_background    #1d2021
set $i3bar_statusline    #ebdbb2
set $i3bar_focus_border  #d65d0e
set $i3bar_focus_bg      #d65d0e
set $i3bar_focus_fg      #ebdbb2
set $i3bar_active_border #d65d0e
set $i3bar_active_bg     #1d2021
set $i3bar_active_fg     #ebdbb2
set $i3bar_inactive_border #d65d0e
set $i3bar_inactive_bg   #1d2021
set $i3bar_inactive_fg   #ebdbb2
set $i3bar_urgent_border #cc241d
set $i3bar_urgent_bg     #cc241d
set $i3bar_urgent_fg     #ebdbb2
set $i3bar_binding_border #d65d0e
set $i3bar_binding_bg    #d65d0e
set $i3bar_binding_fg    #ebdbb2
