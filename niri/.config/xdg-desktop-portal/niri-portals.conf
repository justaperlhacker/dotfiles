[preferred]
# niri session only (XDG_CURRENT_DESKTOP starts with "niri" on niri).
# KDE sessions load kde-portals.conf instead, so each session gets its matching backend.
default=kde
# niri implements org.gnome.Mutter.ScreenCast, so use the gnome backend for screencasting/OBS
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=wlr
# The KDE Settings backend reports color-scheme from Plasma's scheme and ignores
# org.gnome.desktop.interface color-scheme (which DMS sets). Route Settings through
# GTK so kitty/Brave/other portal clients follow DMS light/dark mode.
org.freedesktop.impl.portal.Settings=gtk
# The KDE file chooser follows ~/.config/kdeglobals, which is Plasma's scheme
# (and is a stowed symlink we should not rewrite). Route FileChooser through
# GTK so the dialog follows the DMS-synced GTK theme instead.
org.freedesktop.impl.portal.FileChooser=gtk
