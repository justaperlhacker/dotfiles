# Automatic light/dark theme pair for i3-theme-sync.
#
# DARK  is used from the evening transition until the morning transition.
# LIGHT is used for the rest of the day.
#
# Environment variable I3_DARK_THEME / I3_LIGHT_THEME override these values.
# A theme needs themes/<name>/i3.conf; terminal palettes are optional at
# ~/.config/kitty/<name>.conf and ~/.config/ghostty/themes/<name>.
DARK=github-dark
LIGHT=github-light
