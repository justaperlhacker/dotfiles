# Tokyo Night for dunst
# Matches i3 tokyonight.conf theme colors
# Palette: bg=#1a1b26, fg=#c0caf5, blue=#7aa2f7, red=#f7768e

[global]
    frame_color = "#7aa2f7"

[urgency_low]
    background = "#24283b"
    foreground = "#565f89"
    timeout = 5
    icon = /usr/share/icons/Qogir/16/status/package-installed-outdated.svg

[urgency_normal]
    background = "#1a1b26"
    foreground = "#c0caf5"
    timeout = 5
    override_pause_level = 30
    icon = /usr/share/icons/Qogir/16/emblems/emblem-question.svg

[urgency_critical]
    background = "#1a1b26"
    foreground = "#f7768e"
    frame_color = "#f7768e"
    timeout = 0
    icon = /usr/share/icons/Qogir/16/actions/dialog-warning.svg
