# GitHub Light for dunst
# Palette: bg=#ffffff, bg1=#f6f8fa, fg=#24292f, accent=#0969da, red=#cf222e

[global]
    frame_color = "#0969da"

[urgency_low]
    background = "#f6f8fa"
    foreground = "#57606a"
    timeout = 5
    icon = /usr/share/icons/Qogir/16/status/package-installed-outdated.svg

[urgency_normal]
    background = "#ffffff"
    foreground = "#24292f"
    timeout = 5
    override_pause_level = 30
    icon = /usr/share/icons/Qogir/16/emblems/emblem-question.svg

[urgency_critical]
    background = "#ffffff"
    foreground = "#cf222e"
    frame_color = "#cf222e"
    timeout = 0
    icon = /usr/share/icons/Qogir/16/actions/dialog-warning.svg
